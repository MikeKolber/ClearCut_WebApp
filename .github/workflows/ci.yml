# CI — runs on every push and pull request.
#
# Pushing to `main` auto-deploys to Render, so this workflow is the
# last line of defence: lint + tests + a production build must all be
# green before anything lands on main.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend — lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npx react-scripts test --watchAll=false
        env:
          CI: "true"
      - name: Production build (warnings are errors)
        run: npm run build
        env:
          CI: "true"

  backend:
    name: Backend — lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            physics_engines/core/requirements.txt
      - name: Install dependencies
        run: |
          pip install --upgrade pip wheel
          pip install 'setuptools>=68,<80'
          pip install -r backend/requirements.txt
          pip install -r physics_engines/core/requirements.txt
          pip install pytest ruff
      - name: Ruff lint
        run: ruff check .
      - name: Backend tests
        run: python -m pytest tests/ -v
        working-directory: backend
