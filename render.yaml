# ─────────────────────────────────────────────────────────────────
# Render Blueprint config.
#
# What this provisions:
#   1. clearcut-backend  — Flask + gunicorn web service ($25/mo Standard
#                          tier, 2 GB RAM / 1 CPU, always-on). Reads env vars
#                          for auth, CORS, and optional Cloudflare R2 storage.
#   2. clearcut-frontend — React static site (free, CDN-edge cached).
#                          Proxies /api/* to the backend so the browser
#                          treats everything as same-origin.
#
# How to use:
#   1. Push this file (along with the backend code) to GitHub.
#   2. In Render's dashboard: New + → Blueprint → connect this repo.
#   3. Render reads this file and creates both services. You'll be
#      prompted to fill in the `sync: false` secrets (CC_USERNAME,
#      CC_PASSWORD_HASH, etc.) before the first deploy.
#
# Notes:
#   * If a name like "clearcut-backend" is already taken globally on
#     Render, the dashboard will append a suffix and you'll need to
#     update the static-site route's `destination:` URL accordingly.
#   * `CC_SECRET_KEY` is auto-generated on first deploy and persists
#     across redeploys. Rotating it logs every coworker out.
# ─────────────────────────────────────────────────────────────────

services:
  # ───────────────────────── Backend ──────────────────────────────
  - type: web
    name: clearcut-backend
    runtime: python
    plan: standard           # $25/mo, 2 GB RAM / 1 CPU, always-on. 'starter' ($7) or 'free' (sleeps) also work.
    region: oregon           # Change if you want a closer Render region.
    rootDir: backend
    # Install both requirement files — backend/ has just the web/auth
    # deps; the heavy scientific stack (pandas, scipy, pyproj, plotly,
    # numba, etc.) lives with the calculation engines.
    #
    # Upgrading pip + wheel FIRST is required: Python 3.12's venv module
    # no longer auto-installs setuptools. We then install setuptools at
    # a *pinned* version (<80) because v80+ removed `pkg_resources`,
    # which pyatmos still imports. Without this prelude, the simulation
    # crashes with ModuleNotFoundError: pkg_resources.
    buildCommand: pip install --upgrade pip wheel && pip install 'setuptools>=68,<80' && pip install -r requirements.txt && pip install -r ../physics_engines/core/requirements.txt
    # Persistent disk — survives redeploys + restarts. Holds:
    #   /var/data/shared/        Saved presets + saved simulations
    #                            (shared library, visible to everyone)
    #   /var/data/sessions/<sid>/  Per-browser "current run" workspace
    #                              so two coworkers don't see each
    #                              other's live trajectory output.
    # 1 GB is plenty — JSON presets are tiny, saved sims are ~100 MB
    # each so this fits ~9 of them comfortably plus a hundred presets.
    disk:
      name: clearcut-data
      mountPath: /var/data
      sizeGB: 1
    # 1 process, 4 threads, 600-second timeout.
    #
    # Single-worker is REQUIRED here — `_active_runs` (the trajectory
    # / debris run registry) is in-memory per Python process. With
    # multiple workers, a POST that creates a run in worker A's
    # memory would 404 when its polling GET hits worker B.
    # Threads share that memory, so 4 threads gives us ~4 concurrent
    # users with no run-tracking surprises.
    #
    # The 600 s timeout covers the slowest *synchronous* requests —
    # first-parse of a multi-hundred-MB TDMS file or a large compare
    # XLSX. (Simulations themselves are subprocesses tracked via short
    # polling requests, so they aren't bounded by this.) A worker kill
    # mid-parse would also orphan the in-memory run registry, so the
    # generous value doubles as protection for live runs.
    startCommand: gunicorn -w 1 --threads 4 --timeout 600 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /api/ping
    envVars:
      # Pin Python to 3.12. Render's auto-detected default has been
      # 3.14, where the scientific stack still has rough edges (e.g.
      # pyatmos imports pkg_resources, which 3.12+ no longer ships
      # by default unless setuptools is installed explicitly). 3.12
      # is the most-tested Python for the trajectory engine.
      - key: PYTHON_VERSION
        value: "3.12.7"

      # Disable boto3's automatic EC2 Instance Metadata Service (IMDS)
      # lookup. Render isn't AWS, so IMDS on 169.254.169.254 is
      # unreachable — but boto3 will happily wait 10+ seconds trying
      # to reach it during its credential-resolution chain, even
      # though we provide explicit R2 access keys. Turning this off
      # tells botocore to skip IMDS entirely.
      - key: AWS_EC2_METADATA_DISABLED
        value: "true"

      # Point user-writable data at the persistent disk mounted above.
      # Two trees inside:  shared/  (preset + saved-sim library, all
      # users see)  and  sessions/<sid>/  (live current-run workspace,
      # private per browser session — so coworkers don't overwrite
      # each other's plots when they run sims at the same time).
      - key: CC_DATA_DIR
        value: /var/data

      # Cookie-signing key — Render auto-generates 32 random bytes once,
      # then keeps the same value across redeploys. Safe to ship.
      - key: CC_SECRET_KEY
        generateValue: true

      # Production defaults (HTTPS-only cookies, 12-hour sessions).
      - key: CC_COOKIE_SECURE
        value: "1"
      - key: CC_SESSION_HOURS
        value: "12"

      # ─ Sensitive: prompted on first deploy, never committed ─────
      - key: CC_USERNAME
        sync: false
      - key: CC_PASSWORD_HASH
        sync: false

      # Optional, but recommended: comma-separated allow-list of
      # browser origins. Set this to your final frontend URL after
      # the static site is up (e.g. https://clearcut-frontend.onrender.com
      # and/or https://tools.clearcutspace.com).
      - key: CC_CORS_ORIGINS
        sync: false

      # ─ Cloudflare R2 (engine-test storage) — leave blank to skip ─
      # When CC_R2_BUCKET is set, all four CC_R2_* vars must be set
      # together. Leave them all blank to use local-disk mode (which
      # on Render means an empty Engine Test page).
      - key: CC_R2_BUCKET
        sync: false
      - key: CC_R2_ENDPOINT
        sync: false
      - key: CC_R2_ACCESS_KEY_ID
        sync: false
      - key: CC_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CC_R2_PREFIX
        sync: false

  # ───────────────────────── Frontend ─────────────────────────────
  - type: web
    name: clearcut-frontend
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    envVars:
      # Frontend talks to the backend *directly* via its full URL
      # rather than through a static-site rewrite. Render's rewrite
      # placeholder substitution (`:splat`) doesn't fire reliably for
      # cross-origin destinations — every proxied request was landing
      # at the literal path `/api/:splat` on the backend.
      #
      # Going cross-origin requires the backend's CC_CORS_ORIGINS to
      # include this static site's URL, and the backend's auth cookie
      # to use SameSite=None (handled in production via CC_COOKIE_SECURE).
      - key: REACT_APP_API_BASE
        value: https://clearcut-backend-lw1r.onrender.com
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
    routes:
      # SPA fallback — any non-/api/ path that isn't a real built file
      # falls through to index.html so React-Router can handle it.
      - type: rewrite
        source: /*
        destination: /index.html
