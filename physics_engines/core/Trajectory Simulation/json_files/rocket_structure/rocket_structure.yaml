payload_parameters:
  mass_kg: 285  # kilograms
  radius_m: 0.6  # meters
  length_m: 1  # meters

engine_parameters:
  stage1_engine_mass_kg: 135  # kilograms (per engine)
  stage1_engine_length_m3: 0.8  # meters (m3 likely a typo, should be m)
  stage2_engine_mass_kg: 135  # kilograms (per engine)
  stage2_engine_length_m3: 0.8  # meters
  stage3_engine_mass_kg: 60  # kilograms (per engine)
  stage3_engine_length_m3: 0.8  # meters
  engine_inner_radius_m: 0.18  # meters
  engine_outer_radius_m: 0.2  # meters

number_of_engines:
  stage1_number_of_engines: 9  # count
  stage2_number_of_engines: 3  # count
  stage3_number_of_engines: 1  # count

tank_parameters:
  fuel_tank_mass_ratio: 0.12  # ratio (tank mass / propellant mass)
  oxidizer_tank_mass_ratio: 0.12  # ratio (tank mass / propellant mass)
  fuel_tank_head_mass: 30  # kg
  oxidizer_tank_head_mass: 30  # kg
  tank_thickness_m: 0.01  # meters (1cm wall thickness) #TODO: too much wall thickness

interstage_parameters:
  stage12_interstage:
    mass_kg: 25  # kilograms
    length_m: 0.6  # meters
  stage23_interstage:
    mass_kg: 25  # kilograms
    length_m: 0.6  # meters

fairing_parameters:
  mass_kg: 150  # kilograms
  radius_m: 0.75  # meters
  length_m: 5  # meters

error_handling:
  default_engine_length_m: 0.5  # meters
  default_tank_structure_length_m: 0.2  # meters

notes:
