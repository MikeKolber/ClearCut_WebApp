# Rocket Structure Configuration File
# All units are specified in comments

Fairing:
  Head:
    Shape: Parabolic
    Back Diameter: 1.5  # meters
    Length: 2  # meters
  Cylindrical Section:
    Back Diameter: 1.5  # meters
    Length: 2.5  # meters
  Transition:
    Front Diameter: 1.5  # meters
    Back Diameter: 1.2  # meters
    Length: 0.5  # meters
